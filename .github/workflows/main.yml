name: Compilar DCM MUSIC (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK debug
        shell: bash
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Mostrar errores
        if: always()
        run: |
          echo '### Errores de compilación' >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|error:" -A3 build.log | head -80 >> $GITHUB_STEP_SUMMARY || true
          echo '~~~' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: DCM-MUSIC-APK
          path: app/build/outputs/apk/debug/*.apk
